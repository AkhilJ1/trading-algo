name: Data Health Check

# Requirement 3: confirm data is accurate all the time.
# Runs the live SPY options pipeline through the quality gate every weekday and,
# when Schwab creds are present, reconciles Schwab vs yfinance spot. If anything
# is wrong (empty/unusable chain, bad spot, stale cache, cross-source drift) the
# job FAILS — and GitHub emails the repo owner about the failed run.

on:
  schedule:
    # 22:45 UTC Mon-Fri — just after the daily recorder, after US close year-round.
    - cron: "45 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Schwab token (only if secret is configured)
        env:
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          if [ -n "$SCHWAB_TOKEN" ]; then
            printf '%s' "$SCHWAB_TOKEN" > schwab_token.json
            echo "Schwab token written — cross-source reconciliation will run."
          else
            echo "No Schwab token secret — running yfinance-only health check."
          fi

      - name: Run data-health check
        env:
          # Run the pipeline check through the SAME Schwab-primary path the
          # recorders use, so the printed `source=` line is the authoritative
          # daily answer to "did the option chain actually come from Schwab?"
          # (Schwab raising or failing the quality gate still degrades safely to
          # yfinance — the check passes either way; the source tag tells the
          # truth.) Absent secrets leave Schwab unconfigured (not a failure).
          DATA_PROVIDER: schwab
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN_PATH: schwab_token.json
        run: python data_health.py SPY

      - name: Clean up token
        if: always()
        run: rm -f schwab_token.json
