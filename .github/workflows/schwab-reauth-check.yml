name: Schwab Re-Auth Check

# Requirement 2: the only non-autonomous step is the weekly Schwab browser login.
# This workflow is the "agent" that notifies you before the 7-day refresh token
# dies. It runs daily, measures how long the token has left, and — when it's
# within ~36h of expiry — opens a GitHub issue (which emails you). The pipeline
# keeps running on yfinance fallback in the meantime, so nothing breaks.
#
# Dormant until the SCHWAB_TOKEN secret exists: with no token it reports
# "not configured" and does nothing.

on:
  schedule:
    # 13:00 UTC daily (~morning ET) so there's a full day to react.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: schwab-reauth-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write Schwab token (only if secret is configured)
        env:
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          if [ -n "$SCHWAB_TOKEN" ]; then
            printf '%s' "$SCHWAB_TOKEN" > schwab_token.json
          fi

      - name: Check token status
        id: status
        env:
          SCHWAB_TOKEN_PATH: schwab_token.json
        run: |
          set +e
          out=$(python schwab_token_status.py)
          code=$?
          set -e
          echo "$out"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Keep the human-readable age line for the issue/comment body.
          {
            echo "detail<<EOF"
            echo "$out" | head -1
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # An open issue used to suppress every later alert, so a token that died
      # on day one went unmentioned for the next 40 days while the pipeline
      # quietly served yfinance. Now the first detection opens an issue and each
      # subsequent day comments on it — GitHub emails on new comments, so the
      # reminder keeps arriving until the issue is actually closed.
      - name: Open or escalate re-auth issue
        if: steps.status.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETAIL: ${{ steps.status.outputs.detail }}
        run: |
          TITLE="🔑 Schwab re-auth needed"
          ACTION=$'**Action:** run `python schwab_auth.py` locally to mint a fresh token, then update the `SCHWAB_TOKEN` repo secret (`gh secret set SCHWAB_TOKEN < schwab_token.json`) *and* the Streamlit `SCHWAB_TOKEN` secret, then Reboot the app.\n\nUntil then the pipeline falls back to yfinance — nothing breaks, but every forecast recorded meanwhile is yfinance-sourced. Close this issue once re-authenticated.'
          num=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$(printf '%s\n\n%s' "$DETAIL" "$ACTION")"
            echo "Opened re-auth issue."
          else
            gh issue comment "$num" \
              --body "$(printf 'Still not re-authenticated as of %s UTC.\n\n%s\n\n%s' \
                "$(date -u '+%Y-%m-%d %H:%M')" "$DETAIL" "$ACTION")"
            echo "Escalated existing re-auth issue #$num."
          fi

      - name: Clean up token
        if: always()
        run: rm -f schwab_token.json
