name: Pre-Open Dealer-Pin

# Records SPY's pre-open 0DTE dealer-pin close forecast every market morning,
# then grades it against the realized close just after the bell — a fully
# autonomous, point-in-time-honest pre-open pin scorecard. No website button,
# no local machine: everything runs in GitHub's cloud on a schedule.
#
# Target times are PACIFIC (the user's clock):
#   * 6:25am PT Mon–Fri → RECORD the pre-open pin: estimate today's closing
#     print, anchored on the live pre-market spot, against today's 0DTE whose
#     overnight-settled OI (max-pain + gamma) is already fixed. 6:25am PT is
#     five minutes before the 6:30am PT (9:30 ET) open.
#   * 1:16pm PT Mon–Fri → GRADE the morning estimate against the session's
#     actual closing print (the close is 1:00pm PT / 16:00 ET).
#
# GitHub cron is UTC-only, ignores DST, and — decisively — delivers scheduled
# runs on this repo 2–4 HOURS late (observed Jun 5–10, 2026: the 13:25Z record
# cron started 16:10–17:40Z every day). A single cron per target time
# therefore sails straight past the honesty gates below and the day silently
# records nothing. The crons are now dense WAKE-UPS spanning each target
# window minus 0–4h of expected delay; the gates own the actual clock
# (Pacific hour + weekday) and let exactly the honest runs through. Extra
# wake-ups no-op in seconds, and both halves are idempotent (the ledger keeps
# the latest record per day; grading skips anything already graded), so the
# frequency is harmless.

on:
  schedule:
    - cron: "10,40 9-14 * * 1-5"   # record wake-ups → gate passes only the 6am PT hour
    - cron: "16,46 17-23 * * 1-5"  # grade wake-ups  → gate passes only 1–3:59pm PT
  workflow_dispatch:
    inputs:
      mode:
        description: "Which half to run manually: record | grade"
        required: false
        default: "record"

permissions:
  contents: read

concurrency:
  group: preopen-pin
  cancel-in-progress: false

jobs:
  record-gate:
    # Evaluates on EVERY scheduled wake-up (the Pacific-clock check inside is
    # the real filter), or a manual dispatch with mode=record.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'record')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - name: Check it is actually ~6:25am Pacific
        id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          H=$(TZ=America/Los_Angeles date +%H)
          D=$(TZ=America/Los_Angeles date +%u)
          echo "Pacific time now: $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          if [ "$H" = "06" ] && [ "$D" -le 5 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a weekday 6am PT hour — a wake-up outside the pre-open window. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  record:
    needs: record-gate
    if: needs.record-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify credentials secret is present
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_SA" ]; then
            echo "::warning::GCP_SERVICE_ACCOUNT secret is not set — the pin forecast will only be written to an ephemeral CSV on the runner. Add it under repo Settings -> Secrets and variables -> Actions for a durable record."
          fi

      - name: Write Google service-account credentials (if configured)
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$GCP_SA" ]; then
            printf '%s' "$GCP_SA" > "${{ github.workspace }}/gcp_sa.json"
          fi

      - name: Write Schwab token (only if secret is configured)
        env:
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          if [ -n "$SCHWAB_TOKEN" ]; then
            printf '%s' "$SCHWAB_TOKEN" > schwab_token.json
            echo "Schwab token written — pre-market quote + chain primarily from Schwab (yfinance fallback)."
          else
            echo "No Schwab token secret — using yfinance only (pre-market via prepost minute bars)."
          fi

      - name: Record pre-open dealer-pin forecast
        env:
          GOOGLE_SHEETS_CREDS: ${{ github.workspace }}/gcp_sa.json
          # Schwab primary with a silent yfinance fallback, so the pin is
          # recorded even if the Schwab token has lapsed or no Schwab secret is
          # configured. yfinance supplies the pre-market quote via prepost bars.
          DATA_PROVIDER: schwab
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN_PATH: schwab_token.json
        run: python record_preopen_pin.py SPY

      - name: Clean up credentials
        if: always()
        run: rm -f "${{ github.workspace }}/gcp_sa.json" schwab_token.json

  grade-gate:
    # Evaluates on EVERY scheduled wake-up (the Pacific-clock check inside is
    # the real filter), or a manual dispatch with mode=grade.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'grade')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - name: Check the session has closed (Pacific afternoon)
        id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          H=$(TZ=America/Los_Angeles date +%H)
          D=$(TZ=America/Los_Angeles date +%u)
          echo "Pacific time now: $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          # 13 = on time (1:16pm PT); 14/15 tolerate further delay — the close
          # has settled either way. Rejects mid-session wake-ups. A fully
          # skipped day self-heals: grading is idempotent and the next run
          # picks up anything pending.
          if [ "$D" -gt 5 ]; then
            echo "Weekend — skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$H" in
            13|14|15) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Market not yet closed in PT (mid-session wake-up). Skipping."
               echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  grade:
    needs: grade-gate
    if: needs.grade-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify credentials secret is present
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_SA" ]; then
            echo "::warning::GCP_SERVICE_ACCOUNT secret is not set — grading will read/write an ephemeral CSV on the runner only. Add it for a durable scorecard."
          fi

      - name: Write Google service-account credentials (if configured)
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$GCP_SA" ]; then
            printf '%s' "$GCP_SA" > "${{ github.workspace }}/gcp_sa.json"
          fi

      - name: Write Schwab token (only if secret is configured)
        env:
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          if [ -n "$SCHWAB_TOKEN" ]; then
            printf '%s' "$SCHWAB_TOKEN" > schwab_token.json
            echo "Schwab token written — realized close primarily from Schwab (yfinance fallback)."
          else
            echo "No Schwab token secret — grading from yfinance only."
          fi

      - name: Grade matured pre-open pin forecasts
        env:
          GOOGLE_SHEETS_CREDS: ${{ github.workspace }}/gcp_sa.json
          DATA_PROVIDER: schwab
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN_PATH: schwab_token.json
        run: python grade_pin_forecasts.py

      - name: Clean up credentials
        if: always()
        run: rm -f "${{ github.workspace }}/gcp_sa.json" schwab_token.json
