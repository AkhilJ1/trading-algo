name: Daily Prediction Recorder

# Records one SPY prediction data point per trading day to the Google Sheet
# the dashboard reads from, then grades any earlier forecasts whose expiry day
# has since closed — building a scored, point-in-time-honest track record.
# Runs in GitHub's cloud, independent of any local machine being awake.
#
# Runs at 1:16pm PACIFIC, right after the 1:00pm PT (16:00 ET) close. Post-
# close, options_fetcher rolls past today's expired 0DTE, so the dealer-pin
# row recorded here targets the NEXT session's expiry — a genuine overnight
# forecast, graded by this same job the following afternoon. (The old 22:30
# UTC run picked today's already-closed 0DTE, anchored on the settled close —
# which is how estimated_close == actual_close rows got into the scorecard.)
#
# GitHub cron is UTC-only and ignores DST, so 1:16pm PT needs a PAIR of crons
# (PDT = UTC-7, PST = UTC-8); a gate job lets only the correct one through.

on:
  schedule:
    - cron: "16 20 * * 1-5"   # 1:16pm PDT (Mar–Nov)
    - cron: "16 21 * * 1-5"   # 1:16pm PST (Nov–Mar)
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: daily-record
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - name: Check the session has closed (Pacific afternoon)
        id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          H=$(TZ=America/Los_Angeles date +%H)
          echo "Pacific time now: $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          # 13 = on time (1:16pm PT); 14/15 tolerate GitHub cron delay.
          # Rejects the wrong DST cron of the pair (12:16pm PT, mid-session).
          case "$H" in
            13|14|15) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Market not yet closed in PT (wrong DST cron of the pair). Skipping."
               echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  record:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify credentials secret is present
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_SA" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT secret is not set. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Write Google service-account credentials
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: printf '%s' "$GCP_SA" > "${{ github.workspace }}/gcp_sa.json"

      - name: Write Schwab token (only if secret is configured)
        env:
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          if [ -n "$SCHWAB_TOKEN" ]; then
            printf '%s' "$SCHWAB_TOKEN" > schwab_token.json
            echo "Schwab token written — recording primarily from Schwab (yfinance fallback)."
          else
            echo "No Schwab token secret — recording from yfinance only."
          fi

      - name: Record daily SPY data point
        env:
          GOOGLE_SHEETS_CREDS: ${{ github.workspace }}/gcp_sa.json
          # Make Schwab the primary source. get_provider() builds
          # FallbackProvider(Schwab -> yfinance), so if Schwab is unavailable or
          # the token has lapsed it silently falls back to yfinance — the daily
          # recording never goes dark. Absent Schwab secrets simply leave Schwab
          # unconfigured and the fallback serves everything from yfinance.
          DATA_PROVIDER: schwab
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN_PATH: schwab_token.json
        run: python daily_record.py SPY

      - name: Grade matured forecasts
        # Fills in the realized close for any past forecast whose expiry day has
        # now closed, appending one row per matured forecast to the Outcomes
        # sheet. Idempotent (already-graded forecasts are skipped), so this is
        # safe to run every day. This is what turns the prediction log into a
        # scored, growing track record without any local machine involved.
        env:
          GOOGLE_SHEETS_CREDS: ${{ github.workspace }}/gcp_sa.json
          DATA_PROVIDER: schwab
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN_PATH: schwab_token.json
        run: python grade_predictions.py

      - name: Clean up credentials
        if: always()
        run: rm -f "${{ github.workspace }}/gcp_sa.json" schwab_token.json
